name: Security Audit

# Runs the dependency vulnerability scan on every push and pull request so
# a newly-disclosed CVE in a pinned package is caught in CI, not discovered
# later. Also runnable locally: ./scripts/security-audit.sh

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Also run weekly on its own — a dependency that's clean today can gain
    # a newly-published CVE tomorrow even with no code changes on our side.
    - cron: "0 6 * * 1"

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run dependency vulnerability scan
        run: ./scripts/security-audit.sh
